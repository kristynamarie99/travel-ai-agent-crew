# This workflow will trigger Datadog Synthetic tests within your Datadog organisation
# For more information on running Synthetic tests within your GitHub workflows see: https://docs.datadoghq.com/synthetics/cicd_integrations/github_actions/

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# To get started:

# 1. Add your Datadog API (DD_API_KEY) and Application Key (DD_APP_KEY) as secrets to your GitHub repository. For more information, see: https://docs.datadoghq.com/account_management/api-app-keys/.
# 2. Start using the action within your workflow

name: Run Datadog Synthetic tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Run Synthetic tests within your GitHub workflow.
    # For additional configuration options visit the action within the marketplace: https://github.com/marketplace/actions/datadog-synthetics-ci
    - name: Run Datadog Synthetic tests
      uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
      with:
        api_key: ${{secrets.DD_API_KEY}}
        app_key: ${{secrets.DD_APP_KEY}}
        test_search_query: 'tag:e2e-tests' #Modify this tag to suit your tagging strategy

- name: astral-sh/setup-uv
  # You may pin to the exact commit or the version.
  # uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
  uses: astral-sh/setup-uv@v10.3.3
  with:
    # The version of uv to install, e.g., `0.5.0`, `latest`, or `latest-known`. Defaults to the version in pyproject.toml or `latest`.
    version: # optional, default is 
    # Path to a file containing the version of uv to install, e.g., uv.toml, pyproject.toml, .tool-versions, requirements.txt or uv.lock. A selected .tool-versions file can also provide the Python version. Defaults to searching for uv.toml and if not found pyproject.toml.
    version-file: # optional, default is 
    # The version of Python to set UV_PYTHON to. Overrides the Python version from .tool-versions.
    python-version: # optional
    # The Python architecture to set UV_PYTHON_ARCH to, e.g., x86_64 or aarch64. Overrides UV_PYTHON_ARCH.
    python-arch: # optional
    # Use uv venv to activate a venv ready to be used by later steps. 
    activate-environment: # optional, default is false
    # Custom path for the virtual environment when using activate-environment. Defaults to '.venv' in the working directory.
    venv-path: # optional, default is 
    # Pass --no-project when creating the venv with activate-environment.
    no-project: # optional, default is false
    # The directory to execute all commands in and look for files such as pyproject.toml
    working-directory: # optional, default is ${{ github.workspace }}
    # The checksum of the uv version to install
    checksum: # optional
    # Used when downloading uv from GitHub releases.
    github-token: # optional, default is ${{ github.token }}
    # Enable the GitHub Actions cache for uv. 'auto' enables caching on GitHub-hosted runners except for release, tag push, pull_request_target, and workflow_run events.
    enable-cache: # optional, default is auto
    # Glob pattern to match files relative to the working directory to control the cache.
    cache-dependency-glob: # optional, default is **/*requirements*.txt
**/*requirements*.in
**/*constraints*.txt
**/*constraints*.in
**/pyproject.toml
**/uv.lock
**/*.py.lock

    # Whether to restore the cache if found.
    restore-cache: # optional, default is true
    # Whether to save the cache after the run. 'auto' disables saving for merge_group events.
    save-cache: # optional, default is auto
    # Suffix for the cache key
    cache-suffix: # optional
    # Local path to store the cache.
    cache-local-path: # optional, default is 
    # Prune cache before saving.
    prune-cache: # optional, default is false
    # Upload managed Python installations to the Github Actions cache.
    cache-python: # optional, default is false
    # Ignore when nothing is found to cache.
    ignore-nothing-to-cache: # optional, default is false
    # Ignore when the working directory is empty.
    ignore-empty-workdir: # optional, default is false
    # Custom path to set UV_TOOL_DIR to.
    tool-dir: # optional
    # Custom path to set UV_TOOL_BIN_DIR to.
    tool-bin-dir: # optional
    # URL to a custom manifest file in the astral-sh/versions format.
    manifest-file: # optional
    # Download uv from the Astral mirror instead of directly from GitHub Releases.
    download-from-astral-mirror: # optional, default is true
    # Add problem matchers.
    add-problem-matchers: # optional, default is true
    # Suppress info-level log output. Only warnings and errors are shown.
    quiet: # optional, default is false
    # Resolution strategy to use when resolving version ranges. 'highest' uses the latest compatible version, 'lowest' uses the oldest compatible version.
    resolution-strategy: # optional, default is highest

